name: Workflow Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  lint:
    name: Workflow Lint / Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac51fbff1b6c8e6813c0e2e0fda23e5 # v7.0.1
        with:
          fetch-depth: 0
      - name: 判断工作流侧是否有变更
        id: scope
        run: |
          if git diff --quiet origin/main...HEAD -- .github/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: actionlint
        if: steps.scope.outputs.changed == 'true'
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) v1.7.12
          ./actionlint -color
      - name: zizmor
        if: steps.scope.outputs.changed == 'true'
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb914650ad5a367270bfa4df7fcdce9 # v0.6.2
        with:
          online-audits: "false"
          min-severity: high
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.changed == 'true'
      - name: 工作流脚本测试
        if: steps.scope.outputs.changed == 'true'
        run: find .github/scripts -name '*.test.ts' | sed 's|^|./|' | xargs bun test
